<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d44" />
      <stop offset="50%" stop-color="#0e3731" />
      <stop offset="100%" stop-color="#061f1c" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38b2a3" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6fffa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Radar / Sonar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#237f72" stroke-width="3" stroke-dasharray="6,6" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38b2a3" stroke-width="3.5" opacity="0.6" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#4fd1c5" stroke-width="4" opacity="0.8" />

  <!-- Scanner Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#237f72" stroke-width="2.5" opacity="0.35" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#237f72" stroke-width="2.5" opacity="0.35" />

  <!-- Submerged Optical Target Corners -->
  <path d="M 170 185 L 170 170 L 185 170" fill="none" stroke="#6ee7b7" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 342 185 L 342 170 L 327 170" fill="none" stroke="#6ee7b7" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 170 327 L 170 342 L 185 342" fill="none" stroke="#6ee7b7" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 342 327 L 342 342 L 327 342" fill="none" stroke="#6ee7b7" stroke-width="4.5" stroke-linecap="round" />

  <!-- Sonar Pulse Center Glow -->
  <circle cx="256" cy="256" r="45" fill="#237f72" opacity="0.3" filter="url(#glow)" />

  <!-- Stylized Marine Waves -->
  <path d="M 140 250 C 170 215, 210 215, 256 250 C 302 285, 342 285, 372 250" 
        fill="none" stroke="url(#waveGrad2)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 140 282 C 170 247, 210 247, 256 282 C 302 317, 342 317, 372 282" 
        fill="none" stroke="url(#waveGrad1)" stroke-width="10" stroke-linecap="round" opacity="0.9" />

  <!-- Tiny Marine Bioluminescence Bubbles -->
  <circle cx="220" cy="190" r="6" fill="#6ee7b7" opacity="0.75" />
  <circle cx="305" cy="180" r="4.5" fill="#a7f3d0" opacity="0.8" />
  <circle cx="330" cy="215" r="3.5" fill="#ffffff" opacity="0.9" />
</svg>

